<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <div class="notebook">
      <header><a class="wordmark" href="{{ '/' | relative_url }}">retrieval / recommendation</a><span class="label">a technical notebook</span></header>
      <main id="content">{{ content }}</main>
      <footer>Notes in progress. Understanding evolves.</footer>
    </div>
  </body>
</html>
