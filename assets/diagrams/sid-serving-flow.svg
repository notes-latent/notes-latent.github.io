<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1080" viewBox="0 0 480 1080" role="img" aria-labelledby="title desc">
<title id="title">Do I need Triton Server?</title><desc id="desc">Start with the Torch service. If targets are met, keep it. Otherwise identify whether computation or request scheduling is the bottleneck, and compare the same model before migrating.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526477"/></marker></defs>
<rect width="480" height="1080" rx="12" fill="#f7f9fc"/>
<text x="24" y="42" font-family="sans-serif" font-size="24" fill="#172b40">Do I need Triton Server?</text>
<g class="card"><rect x="24" y="76" width="432" height="114" rx="9" fill="#e2eefb" stroke="#b5c4d3"/>
<text x="40" y="106" font-family="sans-serif" font-size="20" font-weight="600" fill="#172b40">Start with the Torch service</text>
<text x="40" y="136" font-family="sans-serif" font-size="20" font-weight="400" fill="#172b40">Batch → encode or prefill</text>
<text x="40" y="166" font-family="sans-serif" font-size="20" font-weight="400" fill="#172b40">Select L1 → score L2 → select SIDs</text>
</g>
<path d="M240,190 L240,222" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/>
<g class="card"><rect x="24" y="230" width="432" height="84" rx="9" fill="#fff0d8" stroke="#b5c4d3"/>
<text x="40" y="260" font-family="sans-serif" font-size="20" font-weight="600" fill="#172b40">Measure end-to-end behavior</text>
<text x="40" y="290" font-family="sans-serif" font-size="20" font-weight="400" fill="#172b40">Throughput, p99 latency and cost</text>
</g>
<path d="M150,314 L128,348" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M330,314 L352,348" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/>
<g class="card"><rect x="24" y="356" width="208" height="84" rx="9" fill="#e0f2e8" stroke="#b5c4d3"/>
<text x="40" y="386" font-family="sans-serif" font-size="20" font-weight="600" fill="#172b40">Targets met</text>
<text x="40" y="416" font-family="sans-serif" font-size="20" font-weight="400" fill="#172b40">Keep Torch.</text>
</g>
<g class="card"><rect x="248" y="356" width="208" height="84" rx="9" fill="#fff0d8" stroke="#b5c4d3"/>
<text x="264" y="386" font-family="sans-serif" font-size="19" font-weight="600" fill="#172b40">Target missed</text>
<text x="264" y="416" font-family="sans-serif" font-size="19" font-weight="400" fill="#172b40">Find the cause.</text>
</g>
<path d="M352,440 L352,478" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/>
<g class="card"><rect x="24" y="486" width="432" height="114" rx="9" fill="#e2eefb" stroke="#b5c4d3"/>
<text x="40" y="516" font-family="sans-serif" font-size="19" font-weight="600" fill="#172b40">Is execution the bottleneck?</text>
<text x="40" y="546" font-family="sans-serif" font-size="19" font-weight="400" fill="#172b40">Profile forward, selection and copies.</text>
<text x="40" y="576" font-family="sans-serif" font-size="19" font-weight="400" fill="#172b40">Improve the measured Torch path.</text>
</g>
<g class="card"><rect x="24" y="628" width="432" height="114" rx="9" fill="#e2eefb" stroke="#b5c4d3"/>
<text x="40" y="658" font-family="sans-serif" font-size="19" font-weight="600" fill="#172b40">Is scheduling the bottleneck?</text>
<text x="40" y="688" font-family="sans-serif" font-size="19" font-weight="400" fill="#172b40">Inspect queueing and batch sizes.</text>
<text x="40" y="718" font-family="sans-serif" font-size="19" font-weight="400" fill="#172b40">Compare Triton if it fills that gap.</text>
</g>
<path d="M240,742 L240,776" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/>
<g class="card"><rect x="24" y="784" width="432" height="114" rx="9" fill="#e0f2e8" stroke="#b5c4d3"/>
<text x="40" y="814" font-family="sans-serif" font-size="20" font-weight="600" fill="#172b40">If evaluating Triton Server</text>
<text x="40" y="844" font-family="sans-serif" font-size="20" font-weight="400" fill="#172b40">Keep the same SID computation</text>
<text x="40" y="874" font-family="sans-serif" font-size="20" font-weight="400" fill="#172b40">inside one backend invocation.</text>
</g>
<path d="M240,898 L240,932" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/>
<g class="card"><rect x="24" y="940" width="432" height="114" rx="9" fill="#fff0d8" stroke="#b5c4d3"/>
<text x="40" y="970" font-family="sans-serif" font-size="19" font-weight="600" fill="#172b40">Compare before migrating</text>
<text x="40" y="1000" font-family="sans-serif" font-size="19" font-weight="400" fill="#172b40">Same model, inputs and candidates.</text>
<text x="40" y="1030" font-family="sans-serif" font-size="19" font-weight="400" fill="#172b40">Measure latency and throughput.</text>
</g>
</svg>